<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="كينيدو بالما فيدك">
<title>كينيدو بالما فيدك</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8F7F4"/><stop offset="1" stop-color="#E7EFE8"/></linearGradient>
<linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7FBFC"/><stop offset=".42" stop-color="#C5D0D6"/><stop offset="1" stop-color="#6A787F"/></linearGradient>
<linearGradient id="abs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F7357"/><stop offset="1" stop-color="#163A2C"/></linearGradient>
<filter id="shadow" x="-25%" y="-25%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#11221A" flood-opacity=".22"/></filter>
</defs>
<rect width="1200" height="900" fill="url(#bg)"/>
<circle cx="180" cy="140" r="90" fill="#1E4D3B" opacity=".06"/>
<circle cx="1040" cy="760" r="140" fill="#1E4D3B" opacity=".06"/>
<g transform="translate(600 500)" filter="url(#shadow)">
<ellipse cx="0" cy="-210" rx="168" ry="118" fill="url(#chrome)" stroke="#4C5A61" stroke-width="7"/>
<ellipse cx="-46" cy="-246" rx="52" ry="28" fill="#fff" opacity=".55"/>
<rect x="-42" y="-108" width="84" height="78" rx="18" fill="#1E4D3B"/>
<rect x="-118" y="-40" width="236" height="300" rx="78" fill="url(#abs)"/>
<rect x="-78" y="28" width="156" height="16" rx="8" fill="#A3B899"/>
<text x="0" y="130" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#E7F6EE" letter-spacing="2">KINEDOUX</text>
<text x="0" y="168" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#A3B899">PALMA</text>
</g>
<text x="600" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="42" font-weight="800" fill="#11221A">تشدّو وتمرّرو على الكف</text>
<text x="600" y="138" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1E4D3B">Hold it. Pass it over the palm.</text>
</svg>