<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="الثقل اليومي المغربي">
<title>الثقل اليومي المغربي</title><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8F7F4"/><stop offset="1" stop-color="#E4EDE7"/></linearGradient>
<linearGradient id="bgDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1E4D3B"/><stop offset="1" stop-color="#11221A"/></linearGradient>
<linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F7357"/><stop offset=".55" stop-color="#1E4D3B"/><stop offset="1" stop-color="#163A2C"/></linearGradient>
<linearGradient id="greenLight" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2A6B52"/><stop offset=".45" stop-color="#58A586"/><stop offset="1" stop-color="#2A6B52"/></linearGradient>
<linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D4E0CC"/><stop offset=".5" stop-color="#A3B899"/><stop offset="1" stop-color="#7D9574"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".85"/><stop offset="1" stop-color="#cfe3d7" stop-opacity=".35"/></linearGradient>
<linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16302A"/><stop offset="1" stop-color="#274B3F"/></linearGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFE5DA"/><stop offset="1" stop-color="#F3EEDD"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e8efe9" stop-opacity=".95"/><stop offset="1" stop-color="#e8efe9" stop-opacity="0"/></radialGradient>
<radialGradient id="redglow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff6a58" stop-opacity=".75"/><stop offset="1" stop-color="#ff6a58" stop-opacity="0"/></radialGradient>
<filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#11221A" flood-opacity=".22"/></filter>
<filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#11221A" flood-opacity=".16"/></filter>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#1E4D3B" stroke-opacity=".07" stroke-width="1.5"/></pattern>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2" fill="#1E4D3B" fill-opacity=".13"/></pattern>
<pattern id="mesh" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0H22M0 0V22" stroke="#ffffff" stroke-opacity=".55" stroke-width="2.5" fill="none"/></pattern>
</defs><rect width="1200" height="900" fill="url(#bg)"/><rect width="1200" height="900" fill="url(#grid)"/>
<circle cx="1050" cy="120" r="260" fill="#EBF1EC" opacity=".7"/>
<circle cx="130" cy="800" r="220" fill="#D5E3D9" opacity=".45"/>
<rect x="40" y="620" width="260" height="240" fill="url(#dots)" opacity=".8"/><text x="600" y="100" font-family="Cairo, 'Segoe UI', Tahoma, 'Noto Sans Arabic', Arial, sans-serif" font-size="50" font-weight="800" fill="#1E4D3B" text-anchor="middle" direction="rtl">كل نهار نفس الثقل... نفس العيا</text>
<rect x="60" y="170" width="330" height="520" rx="28" fill="#fff" stroke="none" filter="url(#soft)"/><rect x="60" y="170" width="330" height="330" rx="28" fill="#EBF1EC"/><circle cx="225" cy="340" r="105" fill="none" stroke="#11221A" stroke-width="26"/><path d="M120 340H330M225 340V440" stroke="#11221A" stroke-width="20"/><circle cx="225" cy="340" r="16" fill="#11221A"/><g filter="url(#soft)"><rect x="71" y="562" width="308" height="56" rx="28" fill="#1E4D3B" /><text x="225" y="599.8" font-family="Cairo, 'Segoe UI', Tahoma, 'Noto Sans Arabic', Arial, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle" direction="rtl">8 سوايع فالطوموبيل</text></g>
<rect x="435" y="170" width="330" height="520" rx="28" fill="#fff" stroke="none" filter="url(#soft)"/><rect x="435" y="170" width="330" height="330" rx="28" fill="#EBF1EC"/><rect x="500" y="260" width="200" height="130" rx="10" fill="#11221A"/><rect x="510" y="270" width="180" height="108" rx="6" fill="url(#night)"/><path d="M470 400H730L710 430H490Z" fill="#D5E3D9"/><circle cx="600" cy="324" r="20" fill="#A3B899"/><g filter="url(#soft)"><rect x="418" y="562" width="364" height="56" rx="28" fill="#1E4D3B" /><text x="600" y="599.8" font-family="Cairo, 'Segoe UI', Tahoma, 'Noto Sans Arabic', Arial, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle" direction="rtl">قدام البيسي والتيليفون</text></g>
<rect x="810" y="170" width="330" height="520" rx="28" fill="#fff" stroke="none" filter="url(#soft)"/><rect x="810" y="170" width="330" height="330" rx="28" fill="#EBF1EC"/><path d="M870 470H1110M900 470L920 300H1060L1080 470" fill="none" stroke="#11221A" stroke-width="20" stroke-linejoin="round"/><ellipse cx="990" cy="300" rx="90" ry="24" fill="#D5E3D9" stroke="#11221A" stroke-width="14"/><path d="M960 250q16-30 0-50M1010 250q16-30 0-50" stroke="#A3B899" stroke-width="8" fill="none" stroke-linecap="round"/><g filter="url(#soft)"><rect x="807" y="562" width="336" height="56" rx="28" fill="#1E4D3B" /><text x="975" y="599.8" font-family="Cairo, 'Segoe UI', Tahoma, 'Noto Sans Arabic', Arial, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle" direction="rtl">الوقوف والشقا فالدار</text></g>
<g filter="url(#soft)"><rect x="317" y="761" width="566" height="58" rx="29" fill="#7D9574" /><text x="600" y="800.5" font-family="Cairo, 'Segoe UI', Tahoma, 'Noto Sans Arabic', Arial, sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="middle" direction="rtl">ظهر مضغوط، كتاف متشنجة، رقبة ثقيلة</text></g></svg>