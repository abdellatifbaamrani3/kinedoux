# Local development only. Production Postgres is created inside EasyPanel.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kinedoux
      POSTGRES_PASSWORD: kinedoux
      POSTGRES_DB: kinedoux
    ports: ["5432:5432"]
    volumes: ["kinedoux_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinedoux"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: development
      PORT: "8000"
      DATABASE_URL: postgres://kinedoux:kinedoux@db:5432/kinedoux?sslmode=disable
      SITE_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      PHONE_VALIDATION_MODE: MA
      GOOGLE_SHEETS_WEBHOOK_URL: ""
      GOOGLE_SHEETS_WEBHOOK_SECRET: ""
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        NEXT_PUBLIC_PHONE_VALIDATION_MODE: MA
        NEXT_PUBLIC_WHATSAPP_NUMBER: "212600000000"
        NEXT_PUBLIC_CURRENCY: MAD
        NEXT_PUBLIC_UPSELL_TIMER_SECONDS: "15"
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  kinedoux_pgdata:
